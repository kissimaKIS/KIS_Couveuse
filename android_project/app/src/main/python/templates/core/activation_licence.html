{% extends "base.html" %}
{% block titre %}Activation de la licence{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-warning">
            <div class="card-body">
                <h3 class="card-title mb-3">🔒 {{ txt.activation_required }}</h3>
                <p class="text-muted small">
                    {{ txt.license_desc }}
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ txt.key }}</label>
                        {{ form.cle }}
                    </div>
                    <button type="submit" class="btn btn-warning w-100">{{ txt.activate }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
