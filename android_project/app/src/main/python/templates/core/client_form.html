{% extends "base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ titre }}</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ txt.name }}</label>
                        {{ form.nom }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ txt.phone }}</label>
                        {{ form.telephone }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ txt.notes }}</label>
                        {{ form.notes }}
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            {{ form.est_interne }}
                            <label class="form-check-label">{{ txt.internal_client }}</label>
                        </div>
                        <div class="form-text small">{{ txt.internal_client_help }}</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1">{{ txt.save }}</button>
                        <a href="{% url 'client_liste' %}" class="btn btn-outline-secondary">{{ txt.cancel }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
