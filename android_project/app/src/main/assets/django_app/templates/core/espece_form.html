{% extends "base.html" %}
{% block titre %}{{ titre }}{% endblock %}
{% block contenu %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">{{ titre }}</h3>
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">{{ txt.name }}</label>
                        {{ form.nom }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ txt.price }}</label>
                        {{ form.prix_unitaire }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ txt.incubation }} ({{ txt.date }})</label>
                        {{ form.duree_incubation_jours }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ txt.image }}</label>
                        {{ form.icone }}
                    </div>
                    <div class="mb-3">
                        <div class="form-check">
                            {{ form.actif }}
                            <label class="form-check-label">{{ txt.active }}</label>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success flex-grow-1">{{ txt.save }}</button>
                        <a href="{% url 'espece_liste' %}" class="btn btn-outline-secondary">{{ txt.cancel }}</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
