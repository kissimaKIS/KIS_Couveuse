{% extends "base.html" %}
{% block titre %}{{ txt.new_customer }}{% endblock %}
{% block contenu %}
<div class="card shadow-sm">
    <div class="card-body">
        <h3>👤 {{ txt.new_customer }}</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">{{ txt.name }}</label>
                {{ form.nom }}
            </div>
            <div class="mb-3">
                <label class="form-label">{{ txt.phone }}</label>
                {{ form.telephone }}
            </div>
            <div class="mb-3">
                <div class="form-check">
                    {{ form.est_interne }}
                    <label class="form-check-label">{{ txt.internal_client }}</label>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success flex-grow-1">{{ txt.save }}</button>
                <a href="{% url 'depot_creer' %}" class="btn btn-outline-secondary">{{ txt.cancel }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
